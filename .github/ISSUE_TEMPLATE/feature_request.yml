name: Idea or feature request
description: Something LuxEngine should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What do you want to do?
      description: Describe the situation, for example "During a song I want to …".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Optional. A sketch or a comparison with another program is welcome.
