name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out version
        id: version
        shell: pwsh
        run: |
          $version = "1.0.0"
          if ("${{ github.ref }}" -like "refs/tags/v*") { $version = "${{ github.ref_name }}".TrimStart("v") }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Unit tests
        run: |
          dotnet test tests/LuxEngine.Core.Tests -c Release --logger "console;verbosity=normal"
          dotnet test tests/LuxEngine.Output.Tests -c Release --logger "console;verbosity=normal"

      - name: Publish app (self-contained, x64)
        run: >
          dotnet publish src/LuxEngine.App/LuxEngine.App.csproj
          -c Release -r win-x64 -p:Platform=x64
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Check published files
        shell: pwsh
        run: |
          if (-not (Test-Path publish/LuxEngine.exe)) { throw "LuxEngine.exe missing" }
          $fixtures = (Get-ChildItem publish/fixtures -Filter *.json).Count
          Write-Host "Bundled fixture files: $fixtures"
          if ($fixtures -lt 50) { throw "Fixture library missing from the build" }

      - name: Smoke test (start the app, run cues, take screenshots)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            New-Item -ItemType Directory -Force screenshots | Out-Null
            $bmp.Save("screenshots/$name.png")
          }
          $app = Start-Process publish/LuxEngine.exe -ArgumentList "`"$PWD\samples\Demo.luxshow`"" -PassThru
          Start-Sleep 20
          if ($app.HasExited) { throw "LuxEngine exited during startup (code $($app.ExitCode))" }
          Shot "1-startup"
          # Drive the real UI through Windows UI Automation, like a user clicking.
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $A = [System.Windows.Automation.AutomationElement]
          $win = $A::RootElement.FindFirst([System.Windows.Automation.TreeScope]::Children,
            (New-Object System.Windows.Automation.PropertyCondition($A::ProcessIdProperty, $app.Id)))
          if (-not $win) { throw "Main window not found" }
          function Find($name) {
            $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
              (New-Object System.Windows.Automation.PropertyCondition($A::NameProperty, $name)))
          }
          function Click($name) {
            $el = Find $name
            if (-not $el) { throw "UI element '$name' not found" }
            $el.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          }
          Click "GO"; Start-Sleep 2
          Click "GO"; Start-Sleep 2
          Click "GO"; Start-Sleep 3
          Shot "2-after-go"
          try {
            (Find "Cue").GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
            Start-Sleep 2
            Shot "3-cue-tab"
          } catch { Write-Host "Could not switch to the Cue tab: $_" }
          foreach ($dialog in @("Add fixtures", "DMX outputs")) {
            try {
              Click $dialog; Start-Sleep 3
              Shot ("4-" + ($dialog -replace ' ', '-'))
              Click "Cancel"; Start-Sleep 1
            } catch { Write-Host "Dialog '$dialog' check failed: $_" }
          }
          $log = Join-Path $env:LOCALAPPDATA "LuxEngine\errors.log"
          if (Test-Path $log) { Get-Content $log; throw "The app reported errors" }
          if ($app.HasExited) { throw "LuxEngine crashed while running cues (code $($app.ExitCode))" }
          Stop-Process -Id $app.Id

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} /DSourceDir=..\publish installer\LuxEngine.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: LuxEngine-Setup
          path: installer/Output/LuxEngine-Setup.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >
          gh release create "${{ github.ref_name }}" installer/Output/LuxEngine-Setup.exe
          --title "LuxEngine ${{ steps.version.outputs.version }}" --generate-notes
