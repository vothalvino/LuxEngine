name: Build

on:
  # Branch pushes are tested (their result also shows on pull requests). main is not built again after a
  # merge: the same code was just tested on its branch, and the release tag builds the installer.
  push:
    branches: ["**", "!main"]
    tags: ["v*"]
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
      - uses: actions/checkout@v7

      - name: Work out version
        id: version
        shell: pwsh
        run: |
          # The release tag (e.g. v1.4.1) sets the version; test builds of branches show 0.0.0.
          $version = "0.0.0"
          if ("${{ github.ref }}" -like "refs/tags/v*") { $version = "${{ github.ref_name }}".TrimStart("v") }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Unit tests
        run: |
          dotnet --list-sdks
          dotnet test tests/Lumeshow.Core.Tests -c Release
          dotnet test tests/Lumeshow.Output.Tests -c Release

      - name: Publish app (self-contained, x64)
        run: >
          dotnet publish src/Lumeshow.App/Lumeshow.App.csproj
          -c Release -r win-x64 -p:Platform=x64
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Check published files
        shell: pwsh
        run: |
          if (-not (Test-Path publish/Lumeshow.exe)) { throw "Lumeshow.exe missing" }
          $fixtures = (Get-ChildItem publish/fixtures -Filter *.json).Count
          Write-Host "Bundled fixture files: $fixtures"
          if ($fixtures -lt 50) { throw "Fixture library missing from the build" }

      # Releases skip the app test: the same code already passed it on its branch before merging.
      - name: Smoke test (start the app, run cues, take screenshots)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            New-Item -ItemType Directory -Force screenshots | Out-Null
            $bmp.Save("screenshots/$name.png")
          }
          # Start like someone who used the app while it was called LuxEngine: settings and their own fixtures
          # are in the old folders. All of it must still work.
          $oldData = Join-Path $env:LOCALAPPDATA "LuxEngine"
          $oldDocs = Join-Path ([Environment]::GetFolderPath("MyDocuments")) "LuxEngine"
          New-Item -ItemType Directory -Force $oldData, "$oldDocs\Fixtures" | Out-Null
          '{"recentShows":["C:\\Shows\\From the old name.luxshow"],"firstRunDone":true}' | Set-Content "$oldData\settings.json"
          "kept" | Set-Content "$oldDocs\Fixtures\notes.txt"
          "{}" | Set-Content "$oldDocs\My show.luxshow"
          $app = Start-Process publish/Lumeshow.exe -ArgumentList "`"$PWD\samples\Demo.luxshow`"" -PassThru
          # Drive the real UI through Windows UI Automation, like a user clicking.
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $A = [System.Windows.Automation.AutomationElement]
          # Wait until the window is up and its GO button exists, instead of a fixed wait.
          $win = $null
          foreach ($i in 1..60) {
            if ($app.HasExited) { throw "Lumeshow exited during startup (code $($app.ExitCode))" }
            $win = $A::RootElement.FindFirst([System.Windows.Automation.TreeScope]::Children,
              (New-Object System.Windows.Automation.PropertyCondition($A::ProcessIdProperty, $app.Id)))
            if ($win -and $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
                (New-Object System.Windows.Automation.PropertyCondition($A::NameProperty, "GO")))) { break }
            $win = $null
            Start-Sleep 1
          }
          if (-not $win) { throw "Main window not found" }
          Start-Sleep 2
          Shot "1-startup"
          $newData = Join-Path $env:LOCALAPPDATA "Lumeshow"
          $newDocs = Join-Path ([Environment]::GetFolderPath("MyDocuments")) "Lumeshow"
          if (-not (Select-String -Path "$newData\settings.json" -Pattern "From the old name" -Quiet)) { throw "The LuxEngine settings were not brought over" }
          if (Test-Path $oldData) { throw "The old settings folder is still there" }
          if (-not (Test-Path "$newDocs\Fixtures\notes.txt")) { throw "The user's fixtures were not brought over" }
          if (-not (Test-Path "$oldDocs\My show.luxshow")) { throw "A show the user saved in Documents\LuxEngine was touched" }
          function Find($name) {
            foreach ($try in 1..3) {
              $el = $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
                (New-Object System.Windows.Automation.PropertyCondition($A::NameProperty, $name)))
              if ($el) { return $el }
              Start-Sleep 1
            }
          }
          function Click($name) {
            $el = Find $name
            if (-not $el) { throw "UI element '$name' not found" }
            $el.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          }
          Click "GO"; Start-Sleep 2
          Click "GO"; Start-Sleep 2
          Click "GO"; Start-Sleep 3
          Shot "2-after-go"
          try {
            (Find "Cue").GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
            Start-Sleep 2
            Shot "3-cue-tab"
          } catch { Write-Host "Could not switch to the Cue tab: $_" }
          try {
            Add-Type -Namespace Lume -Name Mouse -MemberDefinition ('[DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y); ' + '[DllImport("user32.dll")] public static extern void mouse_event(int f, int x, int y, int d, int e);')
            function MouseClick($name) {
              $el = Find $name
              if (-not $el) { throw "UI element '$name' not found" }
              $r = $el.Current.BoundingRectangle
              [Lume.Mouse]::SetCursorPos([int]($r.X + $r.Width / 2), [int]($r.Y + $r.Height / 2))
              [Lume.Mouse]::mouse_event(2, 0, 0, 0, 0); Start-Sleep -Milliseconds 80; [Lume.Mouse]::mouse_event(4, 0, 0, 0, 0)
            }
            (Find "Buttons").GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
            Start-Sleep 2
            Shot "3b-buttons"
            MouseClick "Deep blue button"; Start-Sleep 1
            MouseClick "Red button"; Start-Sleep 1        # touches Deep blue, so Deep blue turns off
            MouseClick "Spots center button"; Start-Sleep 2
            Shot "3c-buttons-on"
            Click "Zoom in (Ctrl + mouse wheel)"; Click "Zoom in (Ctrl + mouse wheel)"; Start-Sleep 1
            $r = (Find "Red button").Current.BoundingRectangle
            $x = [int]($r.X + $r.Width / 2); $y = [int]($r.Y + $r.Height / 2)
            [Lume.Mouse]::SetCursorPos($x, $y); [Lume.Mouse]::mouse_event(0x20, 0, 0, 0, 0)    # middle button down
            foreach ($i in 1..10) { [Lume.Mouse]::SetCursorPos($x - 15 * $i, $y - 6 * $i); Start-Sleep -Milliseconds 30 }
            [Lume.Mouse]::mouse_event(0x40, 0, 0, 0, 0); Start-Sleep 1
            Shot "3d-zoomed-and-panned"
            Click "Show all buttons"; Start-Sleep 1
            (Find "Cue list").GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
          } catch { Write-Host "Buttons check failed: $_" }
          foreach ($dialog in @("Add fixtures", "DMX outputs")) {
            try {
              Click $dialog; Start-Sleep 3
              Shot ("4-" + ($dialog -replace ' ', '-'))
              Click "Cancel"; Start-Sleep 1
            } catch { Write-Host "Dialog '$dialog' check failed: $_" }
          }
          try {
            (Find "Control").GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
            Start-Sleep 1
            $listItem = [System.Windows.Automation.ControlType]::ListItem
            foreach ($n in 1..4) {
              $cond = New-Object System.Windows.Automation.AndCondition(
                (New-Object System.Windows.Automation.PropertyCondition($A::NameProperty, "Par $n")),
                (New-Object System.Windows.Automation.PropertyCondition($A::ControlTypeProperty, $listItem)))
              $item = $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $cond)
              $item.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).AddToSelection()
            }
            Start-Sleep 1
            Click "Blue"; Start-Sleep 2
            Shot "5-control"
            Click "New preset"; Start-Sleep 2
            Shot "5b-preset-auto-name"
            Click "Save"; Start-Sleep 1
          } catch { Write-Host "Control check failed: $_" }
          try {
            $r = (Find "Deep blue").Current.BoundingRectangle
            [Lume.Mouse]::SetCursorPos([int]($r.X + $r.Width / 2), [int]($r.Y + $r.Height / 2))
            foreach ($i in 1..2) { [Lume.Mouse]::mouse_event(2, 0, 0, 0, 0); [Lume.Mouse]::mouse_event(4, 0, 0, 0, 0); Start-Sleep -Milliseconds 60 }
            Start-Sleep 2
            Shot "6-editing-preset"
            Click "Save preset changes"; Start-Sleep 1
          } catch { Write-Host "Preset edit check failed: $_" }
          try {
            MouseClick "Fixtures"; Start-Sleep 1
            MouseClick "Edit fixture type (channels, ranges)…"; Start-Sleep 3
            Shot "7-edit-fixture-type"
            Click "Cancel"; Start-Sleep 1
            # After using a menu, shortcuts must not drop it again (Ctrl+Up/Down master, arrows, Enter).
            Add-Type -Namespace Lume -Name MenuKeys -MemberDefinition '[DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, int flags, int extra);'
            foreach ($k in @(@(0x11,0x26), @(0x11,0x28), @(0x28), @(0x0D))) {
              foreach ($v in $k) { [Lume.MenuKeys]::keybd_event($v, 0, 0, 0) }
              foreach ($v in $k) { [Lume.MenuKeys]::keybd_event($v, 0, 2, 0) }
              Start-Sleep -Milliseconds 300
            }
            Start-Sleep 1
            Shot "7b-no-menu-after-keys"
          } catch { Write-Host "Edit fixture type check failed: $_" }
          try {
            $cond = New-Object System.Windows.Automation.AndCondition(
              (New-Object System.Windows.Automation.PropertyCondition($A::NameProperty, "Panel")),
              (New-Object System.Windows.Automation.PropertyCondition($A::ControlTypeProperty, [System.Windows.Automation.ControlType]::ListItem)))
            $item = $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $cond)
            $item.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
            Start-Sleep 2
            Shot "8-white-only-light"
            Click "Full"; Start-Sleep 2
            Shot "8b-white-only-full"
          } catch { Write-Host "White-only light check failed: $_" }
          try {
            $cond = New-Object System.Windows.Automation.AndCondition(
              (New-Object System.Windows.Automation.PropertyCondition($A::NameProperty, "Spot 1")),
              (New-Object System.Windows.Automation.PropertyCondition($A::ControlTypeProperty, [System.Windows.Automation.ControlType]::ListItem)))
            $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $cond).GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
            Start-Sleep 1
            Click "Start movement"; Start-Sleep 2
            Shot "9-movement"
          } catch { Write-Host "Movement check failed: $_" }
          try {
            Click "Shapes…"; Start-Sleep 2
            MouseClick "New"; Start-Sleep 1
            MouseClick "Figure 8"; Start-Sleep 2
            Shot "10-shapes"
            Click "Done"; Start-Sleep 1
          } catch { Write-Host "Shapes check failed: $_" }
          try {
            Click "Areas…"; Start-Sleep 2
            Click "New area"; Start-Sleep 1
            Click "Aim → corner 1"; Start-Sleep 1
            Shot "11-areas"
            Click "Done"; Start-Sleep 1
          } catch { Write-Host "Areas check failed: $_" }
          try {
            Add-Type -Namespace Lume -Name Keys -MemberDefinition '[DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, int flags, int extra);'
            function Press([byte[]]$keys) {
              foreach ($k in $keys) { [Lume.Keys]::keybd_event($k, 0, 0, 0) }
              [array]::Reverse($keys)
              foreach ($k in $keys) { [Lume.Keys]::keybd_event($k, 0, 2, 0) }
              Start-Sleep -Milliseconds 150
            }
            function SelectLight($name) {
              $cond = New-Object System.Windows.Automation.AndCondition(
                (New-Object System.Windows.Automation.PropertyCondition($A::NameProperty, $name)),
                (New-Object System.Windows.Automation.PropertyCondition($A::ControlTypeProperty, [System.Windows.Automation.ControlType]::ListItem)))
              $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $cond).GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
              Start-Sleep 1
            }
            SelectLight "Par 1"
            Press 0x10,0x44; Press 0x35; Press 0x30; Press 0x0D; Start-Sleep 1    # Shift+D, 5, 0, Enter
            Shot "12-parameter-bar"
            Press 0x10,0x5A; Start-Sleep 1                                          # Shift+Z on a par: no zoom
            Shot "12b-no-zoom"
            Press 0x1B; Start-Sleep 1; Press 0x1B; Start-Sleep 1                    # Esc: close, then deselect
            Press 0x10,0x44; Start-Sleep 1                                          # Shift+D with nothing selected
            Shot "12c-nothing-selected"
            SelectLight "Spot 1"
            Press 0x48; Start-Sleep 2                                               # H: highlight
            Shot "13-highlight"
            Press 0x48; Start-Sleep 1
            Press 0x73; Start-Sleep 1; Press 0x31; Start-Sleep 2                    # F4 buttons, then key 1
            Shot "14-key-button"
            Press 0x70; Start-Sleep 2                                               # F1: shortcut sheet
            Shot "15-shortcuts"
            Press 0x1B; Start-Sleep 1                                               # Esc closes the sheet
          } catch { Write-Host "Keyboard check failed: $_" }
          # Groups and undo: these must work, so a failure here fails the run.
          Press 0x71; Start-Sleep 1                                                 # F2: Control tab
          SelectLight "Par 1"
          $cond = New-Object System.Windows.Automation.AndCondition(
            (New-Object System.Windows.Automation.PropertyCondition($A::NameProperty, "Par 2")),
            (New-Object System.Windows.Automation.PropertyCondition($A::ControlTypeProperty, [System.Windows.Automation.ControlType]::ListItem)))
          $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $cond).GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).AddToSelection()
          Start-Sleep 1
          Press 0x11,0x47; Start-Sleep 2                                            # Ctrl+G: new group
          Shot "16-new-group"
          Press 0x0D; Start-Sleep 2                                                 # Enter: create "Group 1"
          if (-not (Find "Group Group 1")) { throw "The new group is not shown" }
          Press 0x1B; Start-Sleep 1                                                 # Esc: deselect
          Click "Group Group 1"; Start-Sleep 1
          Shot "16b-group-selected"
          Press 0x11,0x5A; Start-Sleep 2                                            # Ctrl+Z
          Shot "17-undo"
          if (Find "Group Group 1") { throw "Undo did not remove the group" }
          if (-not (Find "2 lights selected: Par 1, Par 2")) { throw "Undo deselected the lights" }
          Press 0x11,0x59; Start-Sleep 2                                            # Ctrl+Y
          Shot "18-redo"
          if (-not (Find "Group Group 1")) { throw "Redo did not bring the group back" }
          # Tap tempo, effects to the beat and fan: the controls must be there and react.
          Press 0x1B; Start-Sleep 1                                                 # Esc: deselect
          SelectLight "Par 1"
          foreach ($n in 2..4) {
            $cond = New-Object System.Windows.Automation.AndCondition(
              (New-Object System.Windows.Automation.PropertyCondition($A::NameProperty, "Par $n")),
              (New-Object System.Windows.Automation.PropertyCondition($A::ControlTypeProperty, [System.Windows.Automation.ControlType]::ListItem)))
            $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $cond).GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).AddToSelection()
          }
          Start-Sleep 1
          foreach ($i in 1..4) { Click "Tap tempo"; Start-Sleep -Milliseconds 250 }
          $bpm = (Find "Tap tempo").FindFirst([System.Windows.Automation.TreeScope]::Descendants,
            (New-Object System.Windows.Automation.PropertyCondition($A::ControlTypeProperty, [System.Windows.Automation.ControlType]::Text))).Current.Name
          Write-Host "Tempo after four taps: $bpm"
          if ($bpm -notmatch '^\d+ BPM$') { throw "The tempo is not shown after tapping (got '$bpm')" }
          $beat = Find "Effects to the beat"
          if (-not $beat) { throw "'To the beat' is missing from the Effects card" }
          $beat.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern).Toggle(); Start-Sleep 1
          if (-not (Find "Effect beats").Current.IsEnabled) { throw "'To the beat' did not switch the beats list on" }
          # "Chase" is also the name of a preset in the demo show: take the button.
          $chase = $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.AndCondition(
            (New-Object System.Windows.Automation.PropertyCondition($A::NameProperty, "Chase")),
            (New-Object System.Windows.Automation.PropertyCondition($A::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)))))
          if (-not $chase) { throw "The Chase effect button is missing" }
          $chase.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); Start-Sleep 2
          try { $beat.GetCurrentPattern([System.Windows.Automation.ScrollItemPattern]::Pattern).ScrollIntoView(); Start-Sleep 1 } catch { }
          Shot "19-chase-to-the-beat"
          Click "Stop all"; Start-Sleep 1
          $beat.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern).Toggle(); Start-Sleep 1
          Click "Apply fan"; Start-Sleep 2
          try { (Find "Apply fan").GetCurrentPattern([System.Windows.Automation.ScrollItemPattern]::Pattern).ScrollIntoView(); Start-Sleep 1 } catch { }
          Shot "19b-fan"
          # Phone remote: switch it on in the dialog, then use it the way a phone would.
          MouseClick "Output"; Start-Sleep 1
          $item = $A::RootElement.FindAll([System.Windows.Automation.TreeScope]::Descendants,
            (New-Object System.Windows.Automation.AndCondition(
              (New-Object System.Windows.Automation.PropertyCondition($A::NameProperty, "Phone remote…")),
              (New-Object System.Windows.Automation.PropertyCondition($A::ProcessIdProperty, $app.Id))))) |
            Where-Object { -not $_.Current.IsOffscreen -and $_.Current.BoundingRectangle.Width -gt 0 } | Select-Object -Last 1
          if (-not $item) { throw "Output > Phone remote is missing" }
          $r = $item.Current.BoundingRectangle
          [Lume.Mouse]::SetCursorPos([int]($r.X + $r.Width / 2), [int]($r.Y + $r.Height / 2))
          [Lume.Mouse]::mouse_event(2, 0, 0, 0, 0); Start-Sleep -Milliseconds 80; [Lume.Mouse]::mouse_event(4, 0, 0, 0, 0)
          Start-Sleep 3
          $switch = $null
          foreach ($try in 1..5) {
            # The tree changes while the dialog opens, which can make a search fail: try again.
            try {
              $switch = $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.AndCondition(
                (New-Object System.Windows.Automation.PropertyCondition($A::NameProperty, "Phone remote")),
                (New-Object System.Windows.Automation.PropertyCondition($A::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)))))
            } catch { Write-Host "Looking for the remote switch: $_" }
            if ($switch) { break }
            Start-Sleep 1
          }
          if (-not $switch) { Shot "19c-remote-switch-missing" }
          if (-not $switch) { throw "The phone remote switch is missing" }
          $switch.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern).Toggle(); Start-Sleep 3
          $pin = (Find "Remote PIN").GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).Current.Value
          if ($pin -notmatch '^\d{4}$') { throw "Switching the remote on did not create a PIN (got '$pin')" }
          $remote = "http://localhost:8080"
          $page = Invoke-WebRequest "$remote/" -UseBasicParsing
          if ($page.Content -notmatch "Lumeshow remote") { throw "The remote page is not served" }
          $denied = try { (Invoke-WebRequest "$remote/api/state" -UseBasicParsing).StatusCode } catch { [int]$_.Exception.Response.StatusCode }
          if ($denied -ne 401) { throw "The remote answered $denied without a PIN (expected 401)" }
          $state = Invoke-RestMethod "$remote/api/blackout?on=1&pin=$pin" -Method Post
          Write-Host "Remote state: $($state | ConvertTo-Json -Compress -Depth 4)"
          if (-not $state.blackout) { throw "Blackout from the remote did not work" }
          if ($state.buttons.Count -lt 1) { throw "The remote does not list the cue buttons" }
          Start-Sleep 1
          Shot "19c-phone-remote"                                                   # the Blackout button behind the dialog is red
          $state = Invoke-RestMethod "$remote/api/blackout?on=0&pin=$pin" -Method Post
          if ($state.blackout) { throw "The remote could not switch blackout off" }
          $switch.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern).Toggle(); Start-Sleep 2
          $stopped = try { Invoke-WebRequest "$remote/" -UseBasicParsing -TimeoutSec 5 | Out-Null; $false } catch { $true }
          if (-not $stopped) { throw "Switching the remote off did not stop it" }
          Click "Done"; Start-Sleep 1
          try {
            # The same screens in the dark theme (the runner uses Windows light, so the other screenshots show light).
            foreach ($theme in @("Dark")) {
              MouseClick "View"; Start-Sleep 1
              # The opened menu is its own pop-up window, so look for the item anywhere in this app.
              $items = $A::RootElement.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                (New-Object System.Windows.Automation.AndCondition(
                  (New-Object System.Windows.Automation.PropertyCondition($A::NameProperty, $theme)),
                  (New-Object System.Windows.Automation.PropertyCondition($A::ProcessIdProperty, $app.Id)))))
              # Menus opened earlier can leave hidden copies behind: use the one on screen.
              $item = $items | Where-Object { -not $_.Current.IsOffscreen -and $_.Current.BoundingRectangle.Width -gt 0 } | Select-Object -Last 1
              $r = $item.Current.BoundingRectangle
              [Lume.Mouse]::SetCursorPos([int]($r.X + $r.Width / 2), [int]($r.Y + $r.Height / 2))
              [Lume.Mouse]::mouse_event(2, 0, 0, 0, 0); Start-Sleep -Milliseconds 80; [Lume.Mouse]::mouse_event(4, 0, 0, 0, 0)
              Start-Sleep 2
              Press 0x71; Start-Sleep 1                                              # F2: Control tab
              SelectLight "Par 1"
              foreach ($n in 2..4) {
                $cond = New-Object System.Windows.Automation.AndCondition(
                  (New-Object System.Windows.Automation.PropertyCondition($A::NameProperty, "Par $n")),
                  (New-Object System.Windows.Automation.PropertyCondition($A::ControlTypeProperty, [System.Windows.Automation.ControlType]::ListItem)))
                $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $cond).GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).AddToSelection()
              }
              Start-Sleep 2
              Shot "20-$theme-control"
              SelectLight "Spot 1"; Start-Sleep 2
              Shot "21-$theme-moving-head"
              Press 0x72; Start-Sleep 1                                              # F3: cue list
              Press 0x20; Start-Sleep 1                                              # GO, shot mid-fade
              Shot "22-$theme-cue-list"
              Press 0x73; Start-Sleep 1; Press 0x31; Start-Sleep 2                   # F4 buttons, key 1
              Shot "23-$theme-buttons"
              Press 0x31; Start-Sleep 1
            }
          } catch { Write-Host "Theme screenshots failed: $_" }
          $log = Join-Path $env:LOCALAPPDATA "Lumeshow\errors.log"
          if (Test-Path $log) { Get-Content $log; throw "The app reported errors" }
          if ($app.HasExited) { throw "Lumeshow crashed while running cues (code $($app.ExitCode))" }
          Stop-Process -Id $app.Id

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} /DSourceDir=..\publish installer\Lumeshow.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      # Install the last version that was called LuxEngine, then this build over it, like a user updating.
      - name: Upgrade test (LuxEngine 1.8.0 to this build)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download v1.8.0 --repo "${{ github.repository }}" --pattern "LuxEngine-Setup.exe" --dir old
          $programs = Join-Path $env:LOCALAPPDATA "Programs"
          $startMenu = [Environment]::GetFolderPath("Programs")
          $desktop = [Environment]::GetFolderPath("Desktop")
          function Setup($exe, $log) {
            $p = Start-Process $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/LOG=$log" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "$exe ended with code $($p.ExitCode)" }
          }
          function Check($ok, $what) { if (-not $ok) { $script:failed = $true; Write-Host "FAILED: $what" } else { Write-Host "ok: $what" } }
          function Class($name) { (Get-ItemProperty "HKCU:\Software\Classes\$name" -ErrorAction SilentlyContinue).'(default)' }

          Start-Process old\LuxEngine-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/TASKS=desktopicon,association", "/LOG=old.log" -Wait
          if (-not (Test-Path "$programs\LuxEngine\LuxEngine.exe")) { Get-Content old.log -Tail 40; throw "LuxEngine 1.8.0 did not install" }
          "mine" | Set-Content "$programs\LuxEngine\my-own-file.txt"       # something the old installer did not put there

          Setup "installer\Output\Lumeshow-Setup.exe" "upgrade.log"
          Select-String -Path upgrade.log -Pattern "old uninstaller" | ForEach-Object { Write-Host $_.Line }
          $failed = $false
          Check (Test-Path "$programs\Lumeshow\Lumeshow.exe") "Lumeshow is installed in a folder with the new name"
          Check (-not (Test-Path "$programs\LuxEngine\LuxEngine.exe")) "the old program is gone"
          Check (-not (Test-Path "$programs\LuxEngine\LuxEngine.Core.dll")) "the old program files are gone"
          Check (Test-Path "$programs\LuxEngine\my-own-file.txt") "a file the user put in the old folder is kept"
          Check (Test-Path "$startMenu\Lumeshow.lnk") "Start menu has Lumeshow"
          Check (-not (Test-Path "$startMenu\LuxEngine.lnk")) "Start menu no longer has LuxEngine"
          Check (Test-Path "$desktop\Lumeshow.lnk") "the desktop shortcut was carried over under the new name"
          Check (-not (Test-Path "$desktop\LuxEngine.lnk")) "the old desktop shortcut is gone"
          Check ((Class ".luxshow") -eq "Lumeshow.Show") ".luxshow files open with Lumeshow"
          Check (-not (Test-Path "HKCU:\Software\Classes\LuxEngine.Show")) "the old file type entry is gone"
          $entries = @(Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" | Where-Object { $_.DisplayName -match "LuxEngine|Lumeshow" })
          $entries | ForEach-Object { Write-Host "Installed apps list: $($_.DisplayName) in $($_.InstallLocation)" }
          Check ($entries.Count -eq 1 -and $entries[0].DisplayName -like "Lumeshow*") "Windows lists one app, called Lumeshow"

          # The installed program must start, and installing again (a normal update from now on) must work.
          $app = Start-Process "$programs\Lumeshow\Lumeshow.exe" -PassThru
          Start-Sleep 15
          Check (-not $app.HasExited) "the installed Lumeshow starts"
          if (-not $app.HasExited) { Stop-Process -Id $app.Id; Start-Sleep 2 }
          Setup "installer\Output\Lumeshow-Setup.exe" "again.log"
          Check (Test-Path "$programs\Lumeshow\Lumeshow.exe") "installing over Lumeshow keeps it in place"
          Check (-not (Test-Path "$programs\Lumeshow\Lumeshow")) "no nested folder"
          $log = Join-Path $env:LOCALAPPDATA "Lumeshow\errors.log"
          if (Test-Path $log) { Get-Content $log; $failed = $true }
          if ($failed) { Get-Content upgrade.log -Tail 60; throw "The upgrade from LuxEngine did not go as planned" }

      - uses: actions/upload-artifact@v7
        with:
          name: Lumeshow-Setup
          path: installer/Output/Lumeshow-Setup.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # Tags like v1.5.0-preview.1 become a pre-release: not "latest", so normal downloads are unaffected.
          $extra = @()
          if ("${{ github.ref_name }}" -like "*-preview*") { $extra = @("--prerelease", "--notes", "Preview build for testing. Not the current release.") } else { $extra = @("--generate-notes") }
          gh release create "${{ github.ref_name }}" installer/Output/Lumeshow-Setup.exe --title "Lumeshow ${{ steps.version.outputs.version }}" @extra
