name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out version
        id: version
        shell: pwsh
        run: |
          $version = "1.0.0"
          if ("${{ github.ref }}" -like "refs/tags/v*") { $version = "${{ github.ref_name }}".TrimStart("v") }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Unit tests
        run: |
          dotnet test tests/LuxEngine.Core.Tests -c Release --logger "console;verbosity=normal"
          dotnet test tests/LuxEngine.Output.Tests -c Release --logger "console;verbosity=normal"

      - name: Publish app (self-contained, x64)
        run: >
          dotnet publish src/LuxEngine.App/LuxEngine.App.csproj
          -c Release -r win-x64 -p:Platform=x64
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Check published files
        shell: pwsh
        run: |
          if (-not (Test-Path publish/LuxEngine.exe)) { throw "LuxEngine.exe missing" }
          $fixtures = (Get-ChildItem publish/fixtures -Filter *.json).Count
          Write-Host "Bundled fixture files: $fixtures"
          if ($fixtures -lt 50) { throw "Fixture library missing from the build" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} /DSourceDir=..\publish installer\LuxEngine.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: LuxEngine-Setup
          path: installer/Output/LuxEngine-Setup.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >
          gh release create "${{ github.ref_name }}" installer/Output/LuxEngine-Setup.exe
          --title "LuxEngine ${{ steps.version.outputs.version }}" --generate-notes
